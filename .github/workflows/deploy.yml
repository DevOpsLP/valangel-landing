name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # GitHub Pages serves a project site from /<repo>/
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          # Point these at the live impoven-cms by adding repository secrets.
          PUBLIC_STRAPI_URL: ${{ secrets.PUBLIC_STRAPI_URL }}
          PUBLIC_STRAPI_TOKEN: ${{ secrets.PUBLIC_STRAPI_TOKEN }}
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}
          PUBLIC_WA_NUMBER: ${{ secrets.PUBLIC_WA_NUMBER }}
        run: npm run build

      # enablement:true turns Pages on (source: GitHub Actions) on the first run,
      # so the repo needs no manual setup in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
